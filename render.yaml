# render blueprint: the public api serves recorded cases only and holds no api keys
services:
  - type: web
    name: quaoar-api
    runtime: python
    plan: free
    buildCommand: pip install uv==0.9.5 && uv sync --locked --no-dev
    startCommand: uv run quaoar serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # deploy only commits whose checks passed
    autoDeployTrigger: checksPass
    envVars:
      - key: QUAOAR_PUBLIC_MODE
        value: replay
      - key: QUAOAR_CORS_ORIGIN
        value: https://quaoar.philipsimonderock.com
      - key: PYTHON_VERSION
        value: "3.13"

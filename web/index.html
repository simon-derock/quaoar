<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quaoar</title>
  <meta name="description" content="Check every IPO before you apply.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Quaoar</h1>
    <p class="tag">Check every IPO before you apply. <span lang="hi">Pehle jaanch, phir apply.</span></p>
  </header>
  <main>
    <section aria-label="Terminal">
      <div class="bar">
        <label for="case">Case</label>
        <select id="case"></select>
        <button id="run" type="button">Replay</button>
      </div>
      <pre id="terminal" tabindex="0"></pre>
    </section>
    <section aria-label="Card">
      <h2 id="company"></h2>
      <p id="headline"></p>
      <ul id="signals"></ul>
      <p id="context" class="small"></p>
      <p id="disclaimer" class="small"></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>

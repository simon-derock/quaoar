# netlify builds the static site from web/: recorded cases and the beginner chat both ship with the page,
# so the site needs no server
# the site is served at https://quaoar.philipsimonderock.com: add it under
# Site configuration > Domain management > Add a domain (netlify dns creates the record and the certificate)
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# short, memorable install address: curl -LsSf https://quaoar.philipsimonderock.com/install | sh
[[redirects]]
  from = "/install"
  to = "/install.sh"
  status = 200
